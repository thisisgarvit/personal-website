# CI (Task 9): typecheck → lint → unit → build → budgets → E2E (chromium).
#
# The full three-engine E2E matrix (chromium/webkit/firefox) is a local
# pre-release step (PRD §16); CI runs chromium only to stay fast and
# reliable on hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from the package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Budget enforcement (PRD §14). This is a blocking release gate.
      - name: Budgets
        run: pnpm check:budgets

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # webServer in playwright.config.ts serves the production build
      # (`pnpm start`) when CI is set; the build step above provides it.
      - name: E2E (chromium)
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
